# Python environment for building the diffusion MRI executable book.
#
#   micromamba create -n dwibook -f environment.yml
#   micromamba run -n dwibook pip install -e .        # once the dwibook package exists
#
# Book engine: Jupyter Book 2, i.e. mystmd (`myst start` for live preview, `myst build`).
# mystmd needs Node >= 20; the system node in WSL is 18, so Node comes from conda-forge.
#
# TRXScan is a pip dependency (the `trxscan` wheel); notebooks simulate single slices of the
# simulated brain live. FSL/MRtrix/qsiprep (via the pennlinc/qsiprep Docker image) are still called
# only from pipelines/, never at book build time.
name: dwibook
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # scientific core
  - numpy
  - scipy
  - pandas
  - nibabel
  - dipy>=1.12
  - matplotlib
  - scikit-image
  - pooch
  # notebooks / execution
  - jupyterlab
  - ipykernel
  - jupytext
  - ipywidgets
  - nbmake
  # book engine (Jupyter Book 2)
  - nodejs>=20
  - pip:
      - mystmd            # jupyter-book 2 engine
      - trxscan[dipy,trx,viz]>=0.1.0   # the simulator, called live on a slab of the simulated brain in notebooks
      - snakemake         # offline pipeline driver (runs in WSL; calls trxscan + docker)
      - sigpy             # iterative / compressed-sensing reconstruction; no chapter imports it at present (CS is discussed in Ch. 6)
      - cvxpy             # dipy's multi-tissue CSD and MAP-MRI positivity constraints (Ch. 15-16)
      - pyyaml            # pipeline configuration, read by the appendices
      # optional extras, installed later if the chapter needs them:
      # - dmri-amico      # NODDI (Ch. 17); pulls spams, which may need a compiler
      # - fury            # 3-D renders; not used on CI
