# Datasets the book depends on (ids match docs/outline.md and dwibook.data.load_dataset).
# Every Snakemake rule reads its parameters from here so the provenance JSON, Appendix A
# (cookbook) and Appendix B (manifest) are all rendered from one source.

# Pinned tool versions. Update deliberately; every dataset's provenance records them.
tools:
  trxscan_repo: /mnt/c/Users/tsalo/Documents/rust-trx/TRXScan
  trxscan_branch: book          # branch carrying the T1-T3 changes (acquisition flags, k-space export, per-volume TE)
  trxscan_commit: null          # not pinned yet: to be set to a commit before the first data release
  qsiprep_image: pennlinc/qsiprep:test   # not pinned yet: to be set to a released tag before the first data release

# Phantom source bundles (world RAS frame shared by tissue maps and streamlines).
phantoms:
  sub-0001a:
    root: /mnt/c/Users/tsalo/Documents/rust-trx/data/trxscan_truth_data
    anat_dir: sub-0001a/anat
    prefix: sub-0001a_space-ACPC
    tract: sub-0001a/tract/sub-0001a_space-ACPC_desc-actsift2_tracks.trx
    weights: sift2_weights          # TRX dps name
    fieldmap: sub-0001a/anat/sub-0001a_space-ACPC_desc-atlas_fieldmap.nii.gz
  sub-60501:
    root: /mnt/c/Users/tsalo/Documents/rust-trx/trxscan-nibs-reference
    anat_dir: sub-60501/ses-01/anat
    prefix: sub-60501_ses-01_space-ACPC
    tract: sub-60501/ses-01/tract/sub-60501_ses-01_space-ACPC_desc-actsift2_tracks.trx
    weights: sift2_weights
    fieldmap: sub-60501/ses-01/anat/sub-60501_ses-01_space-ACPC_fieldmap.nii.gz
    motion_ap: sub-60501/ses-01/dwi/sub-60501_ses-01_dir-AP_desc-confounds_timeseries.tsv
    motion_pa: sub-60501/ses-01/dwi/sub-60501_ses-01_dir-PA_desc-confounds_timeseries.tsv

# Every dataset is a BIDS dataset: sub-<anatomy>/dwi/ holds one run per scheme x variant x
# sweep point, named sub-<anatomy>[_acq-<label>]_dir-<AP|PA>_part-<mag|phase>_dwi; the acq label
# is the scheme (when several), the variant name, and the sweep label, reduced to alphanumerics.
# "{gre}" in a flag list expands to the run's sub-<anatomy>/fmap/ prefix.
# fieldmap: zero replaces the anatomy's fieldmap by an all-zero map on the same grid (written by
# the Snakefile's zero_fieldmap rules), so the run has no susceptibility distortion.
# scheme_flags adds flags to the runs of one scheme only (per-scheme noise in ref-schemes).
# slices / volumes: the pipeline crops the tissue grids to a slab (half-open slice range) and
# truncates the scheme before running trxscan, which has no subsetting flags of its own.
# Settings shared by every run unless a dataset overrides them.
defaults:
  voxel_mm: 2.5
  oversample: 1
  subsample: 200000
  seed: 1
  params: adult
  scheme: hbcd
  extra_flags: []

# Gradient schemes, generated by pipelines/scripts/make_schemes.py into pipelines/config/schemes/.
schemes:
  hbcd:    { source: bundled, file: hbcd_ap }        # 75 volumes, sorted by b for teaching; not HBCD's acquisition order
  hbcd76:  { source: reference, phantom: sub-60501, file: scheme/hbcd75_ap }   # the acquired HBCD protocol, 76 volumes: six b=0, then the shells interleaved; matches the sub-60501 motion traces row for row
  dti30:   { type: single_shell, b: 1000, n_dirs: 30, n_b0: 3 }
  hardi64: { type: single_shell, b: 2000, n_dirs: 64, n_b0: 4 }
  dsi257:  { type: dsi_grid, radius: 4, b_max: 4000, n_b0: 1 }   # |q|^2 <= 16 -> 257 points

datasets:
  ref-clean:
    phantom: sub-0001a
    description: >-
      noise-free reference of the simulated brain with no susceptibility distortion (zero fieldmap)
      and no eddy currents, motion or nonlinearity; the simulator's fixed readout (partial Fourier
      6/8, T2* decay during the readout, a faint Nyquist ghost) remains; the baseline for every comparison
    fieldmap: zero
    truth: true
    truth_peaks: true
  ref-schemes:
    phantom: sub-0001a
    description: >-
      the simulated brain under four schemes at matched scan time: the noise variance per volume is
      scaled by the number of volumes (33, 68, 75, 257) relative to HBCD's 75; CS-DSI is a
      64-volume subset of dsi257 at the DSI run's per-volume noise; no susceptibility distortion
    schemes: [dti30, hardi64, hbcd, dsi257]
    fieldmap: zero
    scheme_flags:                   # noise variance 2e-4 x N / 75
      dti30:   ["--noise", "8.8e-5"]
      hardi64: ["--noise", "1.81e-4"]
      hbcd:    ["--noise", "2e-4"]
      dsi257:  ["--noise", "6.85e-4"]
    csdsi_subset: { of: dsi257, n_keep: 64, seed: 1 }
  presets:
    phantom: sub-0001a
    description: >-
      the same anatomy under the adult, neonatal, and infant tissue presets; their b=0 volumes
      differ only through the presets' T2 values (proton density and T1 are not modeled), and the
      neonatal and infant presets share their T2 values
    extra_flags: ["--noise", "2e-4"]
    variants:
      - { name: adult, params: adult }
      - { name: neonatal, params: neonatal }
      - { name: infant, params: infant }
  slab-kspace:
    phantom: sub-0001a
    description: five-slice slab (slices 28-32) and the first 12 volumes, with exported raw k-space, 8 coils, GRAPPA 2, partial Fourier 6/8
    slices: [28, 33]                # half-open: slices 28, 29, 30, 31, 32
    volumes: 12
    extra_flags: ["--coils", "8", "--accel", "2", "--noise", "2e-4", "--export-kspace"]
    requires: [T1, T2]
  noise-sweep:
    phantom: sub-0001a
    description: four noise levels, single coil, plus one 8-coil GRAPPA-2 run for non-central chi noise; no susceptibility distortion
    fieldmap: zero
    sweep: { flag: "--noise", values: ["5e-5", "2e-4", "8e-4", "3e-3"], labels: [noise1, noise2, noise3, noise4] }
    extra_runs:
      - { name: coils8-r2, extra_flags: ["--noise", "2e-4", "--coils", "8", "--accel", "2"] }
  gibbs:
    phantom: sub-0001a
    description: ringing intrinsic to the acquisition (oversample 2) vs none (oversample 1), plus an apodized variant; no susceptibility distortion
    fieldmap: zero
    variants:
      - { name: o1, oversample: 1 }
      - { name: o2, oversample: 2 }
      - { name: o2-hann, oversample: 2, extra_flags: ["--window", "hann"], requires: [T1] }
  sdc-pair:
    phantom: [sub-0001a, sub-60501]
    description: AP/PA pairs with atlas and measured fieldmaps, plus synthetic GRE fieldmaps
    variants:                       # named by phase-encode direction, not by an acq- label
      - { dir: AP, extra_flags: ["--gre-out", "{gre}", "--gre-res", "2.5"] }
      - { dir: PA, extra_flags: ["--reverse-pe"] }
    precompute: [topup]
  eddy:
    phantom: sub-60501
    description: modeled and replayed eddy currents, geometric and phase, on the acquired 76-volume HBCD scheme
    scheme: hbcd76                  # the replayed eddy trace has one row per acquired volume
    variants:
      - { name: model, extra_flags: ["--eddy", "0.02", "--eddy-quad", "0.005"] }
      - { name: trace, extra_flags: ["--eddy-trace", "{phantom.motion_ap}"] }
      - { name: phase, extra_flags: ["--eddy-phase", "1.7e-5"] }
    precompute: [eddy]
  motion-mb:
    phantom: sub-60501
    description: >-
      real head-motion trace re-simulated per volume on the acquired 76-volume HBCD scheme;
      multiband 3 with a 10% probability per diffusion-weighted volume of a dropout event
    scheme: hbcd76                  # the motion trace has one row per acquired volume
    variants:
      - { name: motion, extra_flags: ["--motion", "{phantom.motion_ap}"] }
      - { name: dropout, extra_flags: ["--mb", "3", "--dropout-rate", "0.1", "--noise", "2e-4"] }
    precompute: [eddy]
  gnl:
    phantom: sub-0001a
    description: >-
      gradient nonlinearity on two gradient systems, a severity sweep, and runs with only the
      spatial warp or only the encoding deviation, with the isocenter 20 mm posterior and 30 mm
      inferior of the ACPC origin; TRXScan writes the truth coefficient file, displacement field
      and graddev image next to each DWI
    extra_flags: ["--noise", "2e-4", "--isocenter", "0,-20,-30"]   # world RAS mm = ACPC space: 20 mm posterior, 30 mm inferior
    variants:
      - { name: wb80, extra_flags: ["--gnl", "whole-body-80"] }
      - { name: wb80-x2, extra_flags: ["--gnl", "whole-body-80", "--gnl-scale", "2.0"] }
      - { name: wb80-warp-only, extra_flags: ["--gnl", "whole-body-80", "--gnl-no-encoding"] }
      - { name: wb80-encoding-only, extra_flags: ["--gnl", "whole-body-80", "--gnl-no-warp"] }
      - { name: c300, extra_flags: ["--gnl", "connectom-300"] }
    precompute: [gradunwarp, tortoise-gnl]   # gradwarp fields + graddev from both toolchains
  kitchen-sink:
    phantom: sub-0001a
    description: every artifact on, corrected end to end by qsiprep
    oversample: 2
    extra_flags: ["--noise", "2e-4", "--coils", "8", "--accel", "2", "--mb", "3", "--dropout-rate", "0.05",
                  "--eddy", "0.02", "--eddy-phase", "1.7e-5", "--gnl", "whole-body-80", "--gre-out", "{gre}"]
    reverse_pe_pair: true
    precompute: [qsiprep]
  voxel-sweep:
    phantom: sub-0001a
    description: 1.5, 2.0, 2.5 and 3.0 mm at fixed scheme and noise; no susceptibility distortion
    fieldmap: zero
    sweep: { key: voxel_mm, values: [1.5, 2.0, 2.5, 3.0], labels: [vox15, vox20, vox25, vox30] }
    extra_flags: ["--noise", "2e-4"]
  te-sweep:
    phantom: sub-0001a
    description: >-
      the HBCD multi-shell scheme at four echo times; the simulator gives each tissue one T2
      (white matter, gray matter, CSF), so the contrast between tissues changes with TE;
      no susceptibility distortion
    fieldmap: zero
    sweep: { flag: "--te", values: ["70", "88", "110", "140"] }
    extra_flags: ["--noise", "2e-4"]
    requires: [T1]
  truth:
    phantom: sub-0001a
    description: the 27 analytic ground-truth maps and truth peaks (no acquisition)
    truth_only: true
