# Datasets the book depends on (ids match docs/outline.md and dwibook.data.load_dataset).
# Every Snakemake rule reads its parameters from here so the provenance JSON, Appendix A
# (cookbook) and Appendix B (manifest) are all rendered from one source.

# Pinned tool versions. Update deliberately; every dataset's provenance records them.
tools:
  trxscan_repo: /mnt/c/Users/tsalo/Documents/rust-trx/TRXScan
  trxscan_branch: book          # branch carrying the T1-T3 changes (acquisition flags, k-space export, per-volume TE)
  trxscan_commit: null          # filled in by the pipeline when the branch is pinned
  qsiprep_image: pennlinc/qsiprep:test   # TODO pin a released tag before the first data release

# Phantom source bundles (world RAS frame shared by tissue maps and streamlines).
phantoms:
  sub-0001a:
    root: /mnt/c/Users/tsalo/Documents/rust-trx/data/trxscan_truth_data
    anat_dir: sub-0001a/anat
    prefix: sub-0001a_space-ACPC
    tract: sub-0001a/tract/sub-0001a_space-ACPC_desc-actsift2_tracks.trx
    weights: sift2_weights          # TRX dps name
    fieldmap: sub-0001a/anat/sub-0001a_space-ACPC_desc-atlas_fieldmap.nii.gz
  sub-60501:
    root: /mnt/c/Users/tsalo/Documents/rust-trx/trxscan-nibs-reference
    anat_dir: sub-60501/ses-01/anat
    prefix: sub-60501_ses-01_space-ACPC
    tract: sub-60501/ses-01/tract/sub-60501_ses-01_space-ACPC_desc-actsift2_tracks.trx
    weights: sift2_weights
    fieldmap: sub-60501/ses-01/anat/sub-60501_ses-01_space-ACPC_fieldmap.nii.gz
    motion_ap: sub-60501/ses-01/dwi/sub-60501_ses-01_dir-AP_desc-confounds_timeseries.tsv
    motion_pa: sub-60501/ses-01/dwi/sub-60501_ses-01_dir-PA_desc-confounds_timeseries.tsv

# Settings shared by every run unless a dataset overrides them.
defaults:
  voxel_mm: 2.5
  oversample: 1
  subsample: 200000
  seed: 1
  params: adult
  scheme: hbcd
  extra_flags: []

# Gradient schemes, generated by pipelines/scripts/make_schemes.py into pipelines/config/schemes/.
schemes:
  hbcd:    { source: bundled, file: hbcd_ap }        # the HBCD 4-shell AP scheme shipped with the phantom
  dti30:   { type: single_shell, b: 1000, n_dirs: 30, n_b0: 3 }
  hardi64: { type: single_shell, b: 2000, n_dirs: 64, n_b0: 4 }
  dsi257:  { type: dsi_grid, radius: 4, b_max: 4000, n_b0: 1 }   # |q|^2 <= 16 -> 257 points

datasets:
  ref-clean:
    phantom: sub-0001a
    description: artifact-free, noise-free reference of the book's phantom; the baseline for every comparison
    truth: true
    truth_peaks: true
  ref-schemes:
    phantom: sub-0001a
    description: the phantom under four schemes at matched scan time, modest noise; CS-DSI is a subset of dsi257
    schemes: [dti30, hardi64, hbcd, dsi257]
    extra_flags: ["--noise", "2e-4"]
    csdsi_subset: { of: dsi257, n_keep: 64, seed: 1 }
  slab-kspace:
    phantom: sub-0001a
    description: five-slice slab with exported raw k-space, 8 coils, GRAPPA 2, partial Fourier 6/8
    slices: [28, 33]
    volumes: 12
    extra_flags: ["--coils", "8", "--accel", "2", "--noise", "2e-4", "--export-kspace"]
    requires: [T1, T2]
  noise-sweep:
    phantom: sub-0001a
    description: four noise levels, single coil, plus one 8-coil GRAPPA-2 run for non-central chi noise
    sweep: { flag: "--noise", values: ["5e-5", "2e-4", "8e-4", "3e-3"] }
    extra_runs:
      - { name: coils8-r2, extra_flags: ["--noise", "2e-4", "--coils", "8", "--accel", "2"] }
  gibbs:
    phantom: sub-0001a
    description: ringing intrinsic to the acquisition (oversample 2) vs none (oversample 1), plus apodized variants
    variants:
      - { name: o1, oversample: 1 }
      - { name: o2, oversample: 2 }
      - { name: o2-hann, oversample: 2, extra_flags: ["--window", "hann"], requires: [T1] }
  sdc-pair:
    phantom: [sub-0001a, sub-60501]
    description: AP/PA pairs with atlas and measured fieldmaps, plus synthetic GRE fieldmaps
    variants:
      - { name: ap, extra_flags: ["--gre-out", "{out}_gre", "--gre-res", "2.5"] }
      - { name: pa, extra_flags: ["--reverse-pe"] }
    precompute: [topup]
  eddy:
    phantom: sub-60501
    description: modelled and replayed eddy currents, geometric and phase
    variants:
      - { name: model, extra_flags: ["--eddy", "0.02", "--eddy-quad", "0.005"] }
      - { name: trace, extra_flags: ["--eddy-trace", "{phantom.motion_ap}"] }
      - { name: phase, extra_flags: ["--eddy-phase", "1.7e-5"] }
    precompute: [eddy]
  motion-mb:
    phantom: sub-60501
    description: real head-motion trace re-simulated per volume; multiband 3 with 10% dropout events
    variants:
      - { name: motion, extra_flags: ["--motion", "{phantom.motion_ap}"] }
      - { name: dropout, extra_flags: ["--mb", "3", "--dropout-rate", "0.1", "--noise", "2e-4"] }
    precompute: [eddy]
  gnl:
    phantom: sub-0001a
    description: >-
      gradient nonlinearity on two gradient systems, a severity sweep, and runs with only the
      spatial warp or only the encoding deviation; TRXScan writes the truth coefficient file,
      displacement field and graddev image next to each DWI
    extra_flags: ["--noise", "2e-4", "--isocenter", "0,-20,-30"]
    variants:
      - { name: wb80, extra_flags: ["--gnl", "whole-body-80"] }
      - { name: wb80-x2, extra_flags: ["--gnl", "whole-body-80", "--gnl-scale", "2.0"] }
      - { name: wb80-warp-only, extra_flags: ["--gnl", "whole-body-80", "--gnl-no-encoding"] }
      - { name: wb80-encoding-only, extra_flags: ["--gnl", "whole-body-80", "--gnl-no-warp"] }
      - { name: c300, extra_flags: ["--gnl", "connectom-300"] }
    precompute: [gradunwarp, tortoise-gnl]   # gradwarp fields + graddev from both toolchains
  kitchen-sink:
    phantom: sub-0001a
    description: every artifact on, corrected end to end by qsiprep
    oversample: 2
    extra_flags: ["--noise", "2e-4", "--coils", "8", "--accel", "2", "--mb", "3", "--dropout-rate", "0.05",
                  "--eddy", "0.02", "--eddy-phase", "1.7e-5", "--gnl", "whole-body-80", "--gre-out", "{out}_gre"]
    reverse_pe_pair: true
    precompute: [qsiprep]
  voxel-sweep:
    phantom: sub-0001a
    description: 1.5, 2.0, 2.5 and 3.0 mm at fixed scheme and noise
    sweep: { key: voxel_mm, values: [1.5, 2.0, 2.5, 3.0] }
    extra_flags: ["--noise", "2e-4"]
  te-sweep:
    phantom: sub-0001a
    description: four echo times at fixed b; per-compartment T2 does the rest
    sweep: { flag: "--te", values: ["70", "88", "110", "140"] }
    extra_flags: ["--noise", "2e-4"]
    requires: [T1]
  truth:
    phantom: sub-0001a
    description: the 27 analytic ground-truth maps and truth peaks (no acquisition)
    truth_only: true
