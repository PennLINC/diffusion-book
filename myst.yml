# Jupyter Book 2 / mystmd configuration. Docs: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: dwibook
  title: Diffusion MRI, executed
  description: >-
    An executable book on diffusion-weighted MRI: physics, acquisition, artifacts and
    preprocessing, reconstruction and modeling, and advanced acquisitions, with every figure
    regenerated from code and every fit compared against simulated ground truth.
  keywords: [diffusion MRI, dMRI, DWI, tractography, microstructure, simulation, TRXScan]
  authors:
    - name: Taylor Salo
      email: tsalo90@gmail.com
  github: https://github.com/PennLINC/diffusion-book
  license:
    content: CC-BY-4.0
    code: MIT
  bibliography:
    - book/references.bib
  # Planning docs and code are not book content.
  exclude:
    - docs/**
    - dwibook/**
    - pipelines/**
    - README.md
  toc:
    - file: book/index.md
    - title: Front matter
      children:
        - file: book/00-frontmatter/how-to-read.md
        - file: book/00-frontmatter/the-phantom.md
        - file: book/00-frontmatter/notation.md
    - title: "Part I: MRI physics"
      children:
        - file: book/01-mri-physics/01-spins-and-signal.md
        - file: book/01-mri-physics/02-spatial-encoding-kspace.md
        - file: book/01-mri-physics/03-reconstruction.md
    - title: "Part II: Diffusion physics and encoding"
      children:
        - file: book/02-diffusion-encoding/04-diffusion-in-tissue.md
        - file: book/02-diffusion-encoding/05-diffusion-encoding.md
        - file: book/02-diffusion-encoding/06-qspace-sampling.md
        - file: book/02-diffusion-encoding/07-acquisition-parameters.md
    - title: "Part III: Artifacts and preprocessing"
      children:
        - file: book/03-preprocessing/08-noise.md
        - file: book/03-preprocessing/08-real-valued-dwi.md
        - file: book/03-preprocessing/09-gibbs-ringing.md
        - file: book/03-preprocessing/10-susceptibility-distortion.md
        - file: book/03-preprocessing/11-eddy-currents.md
        - file: book/03-preprocessing/12-motion-and-dropout.md
        - file: book/03-preprocessing/13-gradient-nonlinearity.md
        - file: book/03-preprocessing/14-assembled-pipeline.md
    - title: "Part IV: Reconstruction and modeling"
      children:
        - file: book/04-modeling/15-signal-representations.md
        - file: book/04-modeling/16-fiber-orientation.md
        - file: book/04-modeling/17-microstructure-models.md
        - file: book/04-modeling/18-tractography.md
        - file: book/04-modeling/19-what-your-data-allow.md
    - title: "Part V: Advanced acquisitions"
      children:
        - file: book/05-advanced/20-multi-te.md
        - file: book/05-advanced/21-multi-echo.md
        - file: book/05-advanced/22-multi-diffusion-time.md
        - file: book/05-advanced/23-frontiers.md
    - title: Appendices
      children:
        - file: book/appendices/a-trxscan-cookbook.md
        - file: book/appendices/b-data-manifest.md
        - file: book/appendices/c-software-environment.md
        - file: book/appendices/d-glossary.md
        - file: book/appendices/e-truth-map-catalogue.md
site:
  template: book-theme
  options:
    folders: true
